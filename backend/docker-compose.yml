name: polaris

services:
  postgres:
    image: postgres:16
    container_name: polaris-postgres
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
    ports:
      - "55432:5432"
    volumes:
      - polaris-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  polaris-data:
